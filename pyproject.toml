[project]
name = "lazy_fred"
version = "0.1.75"
description = "A simplified aggregate of FRED data using fredapi package"
authors = [
    { name = "Jmetrics86", email = "jsnbrwstr@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.2",
    "fredapi>=0.5.2",
    "python-dotenv>=1.1.0",
    "fred>=3.1",
    "rich>=14.3.3",
    "inquirerpy>=0.3.4",
    "urllib3>=2.4.0",
    "requests>=2.32.4",
    "certifi>=2024.7.4",
    "idna>=3.7",
    "tornado>=6.5.7",
    "pygments>=2.19.0",
    "pytest>=8.4.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "pillow>=12.2.0,<13",
    "gitpython>=3.1.47,<4",
]
dev = [
    "ruff>=0.4.6",
    "pytest>=8.4.0",
    "hypothesis>=6.103.0",
]

[project.scripts]
lazy-fred = "lazy_fred:main"
lazy_fred = "lazy_fred:main"
lazy-fred-wizard = "wizard:main"
lazy-fred-dashboard = "dashboard_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "lazy_fred.py",
    "wizard.py",
    "data_store.py",
    "panel.py",
    "dashboard_app.py",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4.6",
    "pytest>=8.4.0",
    "hypothesis>=6.103.0",
]
